# Campus2Career demo script -- what the video shows.
# Each turn is typed into the demo UI against the real agent.
# `narrate` describes what is happening; make_video.py appends what the decider decided,
# so the narration never claims something that did not happen. Keep it under ~2.5 minutes.
title: "Campus2Career: AI Exam-Prep Tutor"
pitch: "An AI exam-prep tutor for college students that selects the right study tool for every request using Strands Decider."
features:
  - "explain technical concepts in plain language with examples and definitions"
  - "create prioritized study plans for upcoming exams"
  - "debug code errors with numbered step-by-step fixes"
  - "generate practice questions in quiz, MCQ and mock-test formats"
  - "recommend tutorials, docs and courses by topic"
  - "ask students to clarify when the request is ambiguous"
eager: false
intro: "This is an AI exam-prep tutor that runs on Amazon Bedrock. Strands Decider reads each student request and selects the right study tool before the LLM responds."
intro_normal: "This agent runs on Amazon Bedrock AgentCore Runtime. Strands Decider picks the right study tool for every request in one forward pass, before Amazon Nova Pro answers."
turns:
  - say: "Explain recursion in C++ in simple terms with a real-life example and show a small program with its output."
    narrate: "A detailed concept request. The decider selects the concept explainer tool."
  - say: "I have my Operating Systems exam tomorrow and only a few hours to study. Build me a study plan."
    narrate: "The student names the subject and the deadline. The decider selects the exam planner tool."
  - say: "My C++ code uses if (a = 0) but it should be if (a == 0). What is wrong and how do I fix it?"
    narrate: "A clear code debugging request. The decider selects the code debugger tool and returns numbered fix steps."
  - say: "Just help me study."
    narrate: "An ambiguous request with no subject or task specified. The decider is unsure and the agent asks the student to clarify."
outro: "One forward pass per decision, calibrated confidence the code can branch on, and Amazon Bedrock for the conversation. Built with the AWS User Group Madurai Strands Decider hackathon kit."